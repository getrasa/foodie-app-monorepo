# Railway service configuration for the `api` service in the foodie-prod project.
# Per-environment differences (DATABASE_*, BETTER_AUTH_URL, WEB_APP_URL, etc.) live
# in Railway environment variables, not here.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node dist/main"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Apply any pending Mikro-ORM migrations before the new container takes traffic.
# Fails the deploy without swapping traffic if migrations don't apply cleanly.
preDeployCommand = "npm run migration:up"
